<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission editor | Simulation prototype</title>
<style>
* {box-sizing:border-box}
body {margin:0;font:15px/1.5 system-ui;color:var(--foreground,#eaf0fa)}
main {max-width:1050px;margin:auto}
header,.panel {padding:16px;background:var(--card,#182434);border:1px solid var(--border,#405268);border-radius:var(--radius,10px)}
header {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
h1,h2,p {margin:0 0 10px} h1 {font-size:22px;margin:0} h2 {font-size:19px}
small,.muted {color:var(--muted-foreground,#b4c3d6)}
button,input {font:inherit;color:inherit;background:var(--secondary,#293b50);border:1px solid var(--border,#526781);border-radius:6px;padding:7px 11px}
button {cursor:pointer} button:disabled {opacity:.52;cursor:default}
button:focus-visible,input:focus-visible {outline:2px solid var(--ring,#81c5ff);outline-offset:2px}
.primary,[aria-pressed=true] {background:var(--primary,#9ed8ff);color:var(--primary-foreground,#0f243a)}
nav,.actions {display:flex;flex-wrap:wrap;gap:7px}
.grid {display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px}
.map {position:relative;height:300px;overflow:hidden;border-radius:8px;background:#173b43}
.map canvas {display:block;width:100%;height:100%}
.legend {position:absolute;bottom:10px;left:10px;background:#112b36;color:#eaf5ff;padding:5px 9px;border-radius:4px}
.banner {padding:10px 12px;margin-bottom:10px;background:var(--secondary,#293b50);border-radius:6px}
.demo {margin-top:10px} .note {margin-top:10px} .map canvas {touch-action:none} .demo p {margin-bottom:6px}
dl {display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin:8px 0 14px} dd {margin:0;text-align:right;font-variant-numeric:tabular-nums}
ol {margin:4px 0 12px;padding-left:21px}
fieldset {border:0;padding:0;margin:0} input {width:100%;margin:5px 0 10px}
@media(max-width:570px){.grid {grid-template-columns:1fr} .map {height:250px} header {flex-wrap:wrap}}
</style>
<main>
<header><div><small>Mission editor · Review prototype</small><h1 id="title">Quarry survey</h1></div><nav aria-label="Editor view"><button id="edit" aria-pressed="false">Edit</button><button id="sim" aria-pressed="true">Simulation</button></nav></header>
<div id="banner" class="banner" hidden>Simulation running · Route editing paused. <button id="back">Back to Simulation</button></div>
<div class="grid">
<section class="map" aria-label="Schematic map of the planned route"><canvas id="map"></canvas><span id="legend" class="legend">Planned route · 3 waypoints</span></section>
<section class="panel" id="detail"></section>
</div>
<section class="panel demo" id="demo"><p><strong>Demo controls</strong> <small>Scripted events</small></p><div class="actions"><button id="advance">Advance telemetry</button><button id="block">Block next segment</button><button id="clear">Clear blockage</button><button id="telemetry">Drop telemetry</button><button id="queue">Queue assistant reply</button><button id="deliver">Deliver queued reply</button></div></section>
</main>
<script>
const el = id => document.getElementById(id);
let tab = 'sim', state = 'ready', blocked = false, fresh = true, progress = 0, tick = 0;
let events = [], advice = false, mission = 'Quarry survey', altitude = 24;
const active = () => state === 'running' || state === 'holding';
const route = [[.15,.76],[.55,.39],[.84,.23]];
let runRoute = null, pendingReply = false, retiredReply = false, proposal = false, replyStatus = '', dragging = null;
const mapRoute = () => state === 'ready' || tab === 'edit' && !active() ? route : runRoute;
const history = () => '<h3>Run events</h3><ol>' + events.map(e => '<li>'+e+'</li>').join('') + '</ol>';
function draw() {
  const canvas = el('map'), w = canvas.clientWidth, h = canvas.clientHeight;
  const d = window.devicePixelRatio || 1; canvas.width = w*d; canvas.height = h*d;
  const c = canvas.getContext('2d'); c.scale(d,d);
  c.strokeStyle='#2e5559'; c.lineWidth=1;
  for(let x=20;x<w;x+=25){ c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke(); }
  for(let y=20;y<h;y+=25){ c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke(); }
  const points = mapRoute().map(([x,y]) => [x*w,y*h]);
  points.slice(1).forEach(([x,y],i)=>{c.beginPath();c.moveTo(...points[i]);c.lineTo(x,y);c.lineWidth=4;c.strokeStyle=blocked&&active()&&i===1?'#ffac74':'#83d9ff';c.setLineDash(blocked&&active()&&i===1?[8,6]:[]);c.stroke();});
  c.setLineDash([]);
  points.forEach(([x,y],i)=>{c.fillStyle='#eaf5ff';c.beginPath();c.arc(x,y,5,0,Math.PI*2);c.fill();c.font='13px system-ui';c.fillText('WP '+(i+1),x-15,y-13);});
  if(state==='ready'||tab==='edit'&&!active()) return;
  const i = progress >= 1 ? 1 : 0, t=progress-i;
  const [x,y]=points[i].map((v,k)=>v+(points[i+1][k]-v)*t);
  c.fillStyle=fresh?'#ffffff':'#c0c7cb'; c.strokeStyle='#122635';c.lineWidth=3;
  c.beginPath();c.arc(x,y,9,0,Math.PI*2);c.fill();c.stroke();
}
const time = () => '00:' + String(tick).padStart(2,'0');
function render() {
  const focus = document.activeElement?.id;
  el('title').textContent=mission;
  for(const key of ['edit','sim']) el(key).setAttribute('aria-pressed',tab===key);
  el('banner').hidden=tab!=='edit'||!active();
  el('advance').disabled=state!=='running'||!fresh||progress>=1.8;
  el('queue').disabled=active()||pendingReply;
  el('deliver').disabled=!pendingReply;
  el('map').style.cursor=tab==='edit'&&!active()?'grab':'default';
  el('block').disabled=state!=='running'||!fresh||progress>=1;
  el('clear').disabled=!blocked;
  el('telemetry').disabled=!active();
  el('telemetry').textContent=fresh?'Drop telemetry':'Restore telemetry';
  el('legend').textContent=!fresh?'Last known position · '+time():blocked&&active()?'Blocked segment · WP 2 to WP 3':active()?'Simulated drone · Planned route':'Planned route · 3 waypoints';
  let html;
  if(tab==='edit') {
    html='<h2>Route settings</h2><fieldset '+(active()?'disabled':'')+'><label>Route name<input id="name"></label><label>Planned altitude (m)<input id="altitude" type="number" min="1" max="120"></label></fieldset><p class="muted">3 waypoints</p><p class="muted">'+(active()?'Waypoint dragging is locked.':'Drag a waypoint to edit the route.')+'</p>';
  } else if(state==='ready'||state==='ended') {
    html='<h2>'+(state==='ended'?'Simulation ended':'Ready to simulate')+'</h2><p class="muted">3 waypoints · '+altitude+' m planned altitude</p><button class="primary" id="start">Start simulation</button>'+(state==='ended'?history():'');
  } else {
    const holding=state==='holding';
    const status=!fresh?'Telemetry unavailable':holding?'Holding':'Running';
    const note=!fresh?'Resume requires fresh telemetry.':blocked?'Segment still blocked.':holding?'Segment clear. Waiting for you to resume.':'Following the planned route.';
    html='<h2>'+status+'</h2><p class="muted">'+note+'</p><dl><dt>Speed</dt><dd>'+(fresh?(holding?'0.0':'4.0')+' m/s':'—')+'</dd><dt>Altitude</dt><dd>'+(fresh?altitude+' m':'—')+'</dd><dt>Last telemetry</dt><dd>'+time()+'</dd></dl><div class="actions"><button id="resume" class="primary" '+(!holding||blocked||!fresh?'disabled':'')+'>Resume</button><button id="end">End simulation</button></div>'+history()+(advice?'<p><strong>Assistant recommendation</strong><br>Stay in hold until the segment is clear and telemetry is available.</p>':'');
  }
  if(pendingReply||replyStatus||proposal) html+='<p class="note muted" role="status">'+(replyStatus||'Assistant reply queued')+'</p>';
  if(proposal && !active()) html+='<button id="apply">Apply proposed change</button>';
  el('detail').innerHTML=html;
  if(el('apply')) el('apply').onclick=()=>{altitude+=5;proposal=false;replyStatus='Proposal applied to the draft.';render();};
  if(el('name')) {el('name').value=mission;el('name').onchange=e=>{mission=e.target.value.trim()||'Quarry survey';el('title').textContent=mission;};}
  if(el('altitude')) {el('altitude').value=altitude;el('altitude').onchange=e=>{altitude=Math.min(120,Math.max(1,Number(e.target.value)||24));e.target.value=altitude;};}
  if(el('start')) el('start').onclick=()=>{runRoute=route.map(point=>[...point]);dragging=null;retiredReply=pendingReply;proposal=false;replyStatus=retiredReply?'Pending assistant turn retired.':'';state='running';progress=.24;tick=1;fresh=true;blocked=false;advice=false;events=['Simulation started'];render();};
  if(el('resume')) el('resume').onclick=()=>{if(state!=='holding'||blocked||!fresh)return;state='running';tick++;events.push('Operator resumed the route');render();};
  if(el('end')) el('end').onclick=()=>{state='ended';events.push('Simulation ended');render();el('start').focus();};
  if(focus && el(focus) && !el(focus).disabled && document.activeElement!==el(focus)) el(focus).focus();
  draw();
}
for(const key of ['edit','sim']) el(key).onclick=()=>{tab=key;render();};
el('back').onclick=()=>{tab='sim';render();el('sim').focus();};
el('block').onclick=()=>{blocked=true;state='holding';tick++;events.push('Next segment blocked','Autopilot commanded hold','Telemetry confirmed hold');advice=true;render();};
el('clear').onclick=()=>{blocked=false;events.push('Blockage cleared');if(fresh)tick++;render();};
el('telemetry').onclick=()=>{fresh=!fresh;if(fresh)tick++;events.push(fresh?'Telemetry restored':'Telemetry unavailable');render();};
el('advance').onclick=()=>{progress=Math.min(1.8,progress+.28);tick++;render();};
el('queue').onclick=()=>{pendingReply=true;retiredReply=false;replyStatus='Assistant reply queued.';render();};
el('deliver').onclick=()=>{
  pendingReply=false;
  if(retiredReply || active()) {
    replyStatus='Late assistant reply ignored.';
    events.push('Late assistant reply ignored');
  } else {
    proposal=true;
    replyStatus='Assistant proposed raising altitude by 5 m.';
  }
  render();
};
const relativePoint = event => {
  const rect=el('map').getBoundingClientRect();
  return [(event.clientX-rect.left)/rect.width,(event.clientY-rect.top)/rect.height];
};
el('map').onpointerdown=event=>{
  if(tab!=='edit'||active()) return;
  const [x,y]=relativePoint(event);
  const point=route.findIndex(([px,py])=>Math.hypot(x-px,y-py)<.05);
  if(point<0) return;
  dragging=point;
  el('map').setPointerCapture(event.pointerId);
};
el('map').onpointermove=event=>{
  if(dragging===null||tab!=='edit'||active()) return;
  route[dragging]=relativePoint(event).map(n=>Math.min(.94,Math.max(.06,n)));
  draw();
};
el('map').onpointerup=el('map').onpointercancel=()=>{dragging=null;};
new ResizeObserver(draw).observe(el('map'));render();
</script>
</html>
